services:
  art-proxy:
    # Replace <owner>/<repo> below once your GitHub Actions build has run once.
    image: ghcr.io/<owner>/<repo>:latest
    container_name: stremio-art-proxy
    restart: unless-stopped
    init: true   # use Docker's built-in tini as PID 1 (proper signal handling/zombie reaping)
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./cache:/data/cache
